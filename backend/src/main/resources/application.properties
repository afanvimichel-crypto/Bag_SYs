spring.application.name=baggage-management
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bagage_guard_system}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.issuer=baggage-management
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT15M
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
